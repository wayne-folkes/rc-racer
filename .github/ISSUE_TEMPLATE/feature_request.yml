name: Feature request
description: Suggest an idea for the game
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why-fun
    attributes:
      label: Why would it be fun?
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Would you like to build it?
      description: See CONTRIBUTING.md for how to get started.
      options:
        - "Yes, I'd like to build it"
        - "Maybe, with some guidance"
        - "No, I'm just sharing the idea"
    validations:
      required: true
