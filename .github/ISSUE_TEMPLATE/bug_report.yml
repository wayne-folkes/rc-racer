name: Bug report
description: Something in the game isn't working right
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report! The more detail you can give, the faster we can fix it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Add a screenshot or clip if you can.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a new season
        2. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and OS or device
      placeholder: Chrome 130 on Windows 11, or Safari on iPhone 15
    validations:
      required: true
  - type: dropdown
    id: controls
    attributes:
      label: How were you playing?
      options:
        - Keyboard
        - Gamepad
        - Touch
    validations:
      required: true
  - type: dropdown
    id: vehicle
    attributes:
      label: Vehicle
      options:
        - Buggy
        - Monster Truck
        - Not sure / not relevant
  - type: input
    id: track
    attributes:
      label: Track
      placeholder: Meadow Loop
  - type: dropdown
    id: easy-mode
    attributes:
      label: Was Easy mode on?
      options:
        - "No"
        - "Yes"
        - Not sure
